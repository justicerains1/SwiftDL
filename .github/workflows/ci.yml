# 构建、测试、打包；推送 v* 标签时额外创建 GitHub Release（程序的自动更新读取最新 Release 的 zip 与其 SHA-256）
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # 创建 Release
    steps:
      - uses: actions/checkout@v5

      # 与本地一致：GNU 工具链 + MinGW-w64（UCRT）
      - name: MinGW-w64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add MinGW to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Rust (stable, windows-gnu)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
          gcc --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Version check
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $ext = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          if ($ext -ne $ver) { throw "extension/manifest.json ($ext) != Cargo.toml ($ver)" }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$ver") {
            throw "tag ${{ github.ref_name }} != Cargo.toml version v$ver"
          }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Extension tests
        # 显式 glob：Node 21+ 的 --test 参数按 glob 解析，直接传目录在部分版本中找不到测试
        run: node --test "extension/tests/*.test.mjs"

      # 静态检查：任何 clippy 告警都视为失败（最小安装的工具链不带 clippy，需单独添加）
      - name: Clippy
        shell: pwsh
        run: |
          rustup component add clippy
          cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      # 部分端到端测试依赖时序，共享 runner 偶有抖动：失败时把详情记为警告注解（便于定位），再完整重跑一次
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          details() { grep -E "^test .* FAILED|panicked at|^---- |assertion|left:|right:" -A2 "$1" | head -60 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          if cargo test --release --locked -- --test-threads=1 2>&1 | tee test1.log; then exit 0; fi
          echo "::warning title=Flaky test (attempt 1 failed, retrying)::$(details test1.log)"
          if cargo test --release --locked -- --test-threads=1 2>&1 | tee test2.log; then exit 0; fi
          echo "::error title=Test failures::$(details test2.log)"
          exit 1

      - name: Package
        run: python -I packaging/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: SwiftDL-v${{ env.VERSION }}-windows-x64
          path: dist/SwiftDL-v${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SwiftDL ${{ github.ref_name }}
          files: dist/SwiftDL-v${{ env.VERSION }}-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
