[package]
name = "swiftdl"
version = "0.3.0"
edition = "2024"
description = "极简高性能多线程下载器"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "clipboard"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "system-proxy", "socks", "charset"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-util = { version = "0.7", default-features = false }
url = "2.5.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_DataExchange", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }
sha2 = "0.11.1"
tray-icon = "0.26.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["block-padding", "alloc"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
