<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui, "Microsoft YaHei"; width: 240px; margin: 12px; }
    label { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    input[type=number] { width: 80px; }
    #st { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <b>SwiftDL</b> <span id="st"></span>
  <label>接管浏览器下载 <input type="checkbox" id="enabled" /></label>
  <label>最小文件大小 (KB) <input type="number" id="minSizeKB" min="0" /></label>
  <label>端口 <input type="number" id="port" min="1024" max="65535" /></label>
  <script src="popup.js"></script>
</body>
</html>
