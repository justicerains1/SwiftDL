<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { font: 13px/1.45 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; width: 360px; margin: 0; color: #1f2937; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #e5e7eb; }
    .logo { width: 22px; height: 22px; border-radius: 6px; background: #2f6fed; display: grid; place-items: center; }
    header b { font-size: 14px; }
    #st { margin-left: auto; font-size: 12px; color: #6b7280; }
    #st.on { color: #16a34a; }
    h4 { margin: 10px 14px 6px; font-size: 12px; color: #6b7280; font-weight: 500; }
    #list { max-height: 330px; overflow: auto; padding: 0 8px 6px; }
    .item { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-radius: 8px; }
    .item:hover { background: #f3f4f6; }
    .tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: #e8efff; color: #2f6fed; flex: none; }
    .tag.audio { background: #fde7f3; color: #db2777; }
    .tag.dash { background: #f3f4f6; color: #6b7280; }
    .info { flex: 1; min-width: 0; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: #6b7280; font-size: 12px; }
    select { max-width: 150px; font-size: 12px; margin-top: 2px; }
    button { border: 0; border-radius: 6px; padding: 5px 10px; background: #2f6fed; color: #fff; cursor: pointer; flex: none; font: inherit; }
    button:disabled { background: #cbd5e1; cursor: default; }
    .empty { padding: 18px 14px; color: #6b7280; text-align: center; }
    details { border-top: 1px solid #e5e7eb; padding: 6px 14px 10px; }
    summary { cursor: pointer; color: #6b7280; font-size: 12px; padding: 4px 0; }
    label { display: flex; align-items: center; justify-content: space-between; margin: 7px 0; }
    input[type=number] { width: 80px; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7.5M4.5 6.8 8 10.3l3.5-3.5M2.8 13.5h10.4"/></svg></div>
    <b>SwiftDL</b><span id="st"></span>
  </header>
  <div id="pair" hidden style="padding:10px 14px;border-bottom:1px solid #e5e7eb;background:#fff7ed">
    <div style="margin-bottom:6px" data-i18n="pairHint"></div>
    <div style="display:flex;gap:6px"><input id="token" style="flex:1" data-i18n-ph="pairPlaceholder" /><button id="savePair" data-i18n="pairButton"></button></div>
  </div>
  <h4 data-i18n="pageMedia"></h4>
  <div id="list"></div>
  <details>
    <summary data-i18n="settings"></summary>
    <label><span data-i18n="optEnabled"></span> <input type="checkbox" id="enabled" /></label>
    <label><span data-i18n="optFloat"></span> <input type="checkbox" id="floatBtn" /></label>
    <label><span data-i18n="optMin"></span> <input type="number" id="minSizeKB" min="0" /></label>
    <label><span data-i18n="optPort"></span> <input type="number" id="port" min="1024" max="65535" /></label>
  </details>
  <script type="module" src="popup.js"></script>
</body>
</html>
